<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ .name }}</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .card {
      background: white;
      padding: 20px 30px;
      border-radius: 14px;
      width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    .song {
      padding: 8px 10px;
      border-radius: 8px;
      background: #f5f5f5;
      margin-bottom: 6px;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #0077ff;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>{{ .name }}</h1>

    <h3>Songs</h3>

    {{ if .songs }}
      {{ range .songs }}
        <div class="song">{{ . }}</div>
      {{ end }}
    {{ else }}
      <p>No songs yet</p>
    {{ end }}

    <a class="back" href="/">← Back</a>
  </div>

</body>
</html>
